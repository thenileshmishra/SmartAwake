<!DOCTYPE html>
<html>
<head>
  <title>SmartAwake Options</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      width: 300px;
    }
    .option {
      margin: 10px 0;
    }
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>SmartAwake Options</h2>
  <div class="option">
    <label for="mode">Default Mode:</label>
    <select id="mode">
      <option value="display">Display Only</option>
      <option value="system">System</option>
    </select>
  </div>
  <script src="options.js"></script>
</body>
</html>
